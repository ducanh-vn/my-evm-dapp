[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

# script/DeployLocalDemo.s.sol ghi địa chỉ Anvil cho giao diện; chỉ cho phép ghi đúng thư mục này.
fs_permissions = [{ access = "read-write", path = "./frontend/src/constants/deployments" }]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 50
fail_on_revert = false

[fmt]
line_length = 120

# Chỉ tham chiếu TÊN biến môi trường (giá trị nằm trong .env, không commit). Không bao giờ ghi URL/API key/private key ở đây.
[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
