[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 50
fail_on_revert = false

[fmt]
line_length = 120

# Không khai báo rpc_endpoints / etherscan / private key ở đây (write-guard policy).
# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
